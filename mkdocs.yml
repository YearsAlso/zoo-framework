# MkDocs 配置 —— 文档站构建
#
# 用途：.github/workflows/docs.yml 在 mkdocs.yml 存在时才会执行 `mkdocs build`，
# 并把产物 site/ 上传为 GitHub Pages 工件。此前本文件缺失，该工作流每次都在
# “上传 site/” 一步失败。
#
# 本地预览：
#   uv run --no-project --with mkdocs-material mkdocs serve
# 本地构建：
#   uv run --no-project --with mkdocs-material mkdocs build
#
# 建议带 --no-project：避免连项目自身一起安装（历史原因：曾触发 gevent 源码编译失败，
# gevent 已随 align-execution-primitives 移除；保留 --no-project 是因为构建文档站
# 不需要项目运行时依赖）。

site_name: Zoo Framework
site_description: 后台任务编排框架 —— 调度 Worker、投递事件、持久化状态
site_url: https://yearsalso.github.io/zoo-framework/
repo_url: https://github.com/YearsAlso/zoo-framework
repo_name: YearsAlso/zoo-framework
# 文档改动一律走 dev 分支（见 CONTRIBUTING.md 的分支规范），
# 因此“编辑此页”指向 dev 而不是默认分支 main。
edit_uri: edit/dev/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  # 用户侧在前、贡献者侧在后。docs/internal/ 通过 exclude_docs 排除，不进入站点。
  - 首页: README.md
  - 安装: install.md
  - 教程:
      - 总览: tutorial/README.md
      - 01 五分钟上手: tutorial/01-quickstart.md
      - 02 状态持久化: tutorial/02-state-persistence.md
      - 03 事件管道: tutorial/03-event-pipeline.md
      - 04 作用域容器: tutorial/04-container.md
      - 05 使用脚手架: tutorial/05-scaffold.md
  - 指南:
      - 总览: guides/README.md
      - 配置参考: guides/config-reference.md
      - 超时与熔断: guides/timeouts.md
      - 状态持久化: guides/state-persistence.md
      - 事件管道: guides/event-pipeline.md
      - 作用域容器: guides/container.md
      - 与其它方案对比: guides/comparison.md
  - API 参考:
      - 总览: api/README.md
      - 运行时: api/runtime.md
      - Worker: api/workers.md
      - 调度: api/scheduler.md
      - 容器: api/container.md
      - 状态: api/state.md
      - 事件: api/events.md
      - 配置: api/config.md
      - 插件: api/plugins.md
      - 原生执行: api/native.md
      - 示例集: api/examples.md
  - 架构概览: ARCHITECTURE.md
  - 性能基准: benchmark.md
  - 迁移指南: MIGRATION.md
  - 版本政策: VERSION_POLICY.md
  - 常见问题: FAQ.md
  - 给贡献者:
      - 总览: contributing/README.md
      - 开发环境搭建: contributing/development.md
      - 目录结构: contributing/structure.md
      - 调试指南: contributing/debugging.md
      - 贡献指南: contributing/contributing.md
      - 品牌与视觉规范: contributing/brand.md
      - 路线图: contributing/roadmap.md

plugins:
  - search:
      lang:
        - zh
        - en
  # API 参考从代码 docstring 自动生成——与实现同步，不手工维护。
  # 每个签名/参数/返回值/异常都直接取自源码，因此文档不可能与代码漂移。
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            filters:
              - "!^_"

# docs/internal/ 是维护者工作日志（商业计划、优化日志、agent 记忆），
# 不发布到文档站；文件保留在仓库里供维护者查阅。
exclude_docs: |
  internal/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  # 让文档里的 ```mermaid 代码块渲染成图（docs/README.md 等使用）
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# 不启用 --strict：docs/ 下多数文档是按 GitHub 仓库内相对路径写的
# （例如 ../bench/DECISION.md、.github/PULL_REQUEST_TEMPLATE.md），
# 这些链接在站点上不存在。构建仍会给出告警但不失败。
# 若要改为严格模式，需先把这些链接改写为绝对 GitHub URL。
strict: false
