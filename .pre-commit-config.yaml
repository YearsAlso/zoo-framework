# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# P0: 代码质量工具 - Ruff + MyPy

repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: debug-statements

  # Ruff - Python 代码格式化和 linting (P0)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      # 运行 linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # 运行 formatter
      - id: ruff-format

  # MyPy - 类型检查 (P0，但本地不卡提交)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      # 置于 manual 阶段，与 CI 对齐：quality.yml 里 mypy 是 continue-on-error，
      # 本地也不应让它拦住提交。两个原因都是既有的、与具体改动无关：
      #   1) 原先的 additional_dependencies: [types-all] 已装不上——types-all 依赖的
      #      types-pkg-resources 已从 PyPI 移除，导致钩子环境无法创建、连提交都做不了。
      #      本仓库实际只用到 click/jinja2/gevent/pyyaml/dotenv 的存根，且已传
      #      --ignore-missing-imports，故直接去掉该 additional_dependencies。
      #   2) 仓库根目录有一个被 git 跟踪的空 __init__.py，使仓库根成为名为 zoo 的包，
      #      mypy 报 "Source file found twice under different module names" 直接无法启动；
      #      修好它之后仍有 81 个既有错误（31 个文件）。在该问题被单独修掉前，mypy
      #      无法作为门禁，故不放默认阶段。
      # 需要时显式运行：pre-commit run --hook-stage manual mypy --all-files
      - id: mypy
        stages: [manual]
        args: [--ignore-missing-imports, --show-error-codes]
        exclude: ^(tests/|test/|example/)

  # 安全扫描
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
