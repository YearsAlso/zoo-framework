# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# P0: 代码质量工具 - Ruff + MyPy

repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # --unsafe 用于放行自定义 YAML 标签：mkdocs.yml 用
      # !!python/name:pymdownx.superfences.fence_code_format 声明 Mermaid 的自定义
      # fence（mkdocs-material 的标准写法），safe_load 会直接拒绝该标签、导致
      # mkdocs.yml 无法提交。本钩子只做语法检查，不解析标签语义。
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: debug-statements

  # Ruff - Python 代码格式化和 linting (P0)
  # rev 必须与项目实际使用的 ruff 对齐：此前钉在 v0.1.14（2024-01），
  # 该版本不认识 pyproject.toml 里的 target-version = "py313"，
  # 直接 "Failed to parse pyproject.toml" 而失败——即 ruff 钩子对本仓库
  # 从来跑不起来。CI 装的是 ruff>=0.1.0 且不锁版本，故本地与 CI 也一直不一致。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # 运行 linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # 运行 formatter
      - id: ruff-format

  # MyPy - 类型检查 (P0，但本地不卡提交)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      # 置于 manual 阶段，与 CI 对齐：quality.yml 里 mypy 是 continue-on-error，
      # 本地也不应让它拦住提交。两个原因都是既有的、与具体改动无关：
      #   1) 原先的 additional_dependencies: [types-all] 已装不上——types-all 依赖的
      #      types-pkg-resources 已从 PyPI 移除，导致钩子环境无法创建、连提交都做不了。
      #      本仓库实际只用到 click/jinja2/gevent/pyyaml/dotenv 的存根，且已传
      #      --ignore-missing-imports，故直接去掉该 additional_dependencies。
      #   2) 仓库根目录有一个被 git 跟踪的空 __init__.py，使仓库根成为名为 zoo 的包，
      #      mypy 报 "Source file found twice under different module names" 直接无法启动；
      #      修好它之后仍有 81 个既有错误（31 个文件）。在该问题被单独修掉前，mypy
      #      无法作为门禁，故不放默认阶段。
      # 需要时显式运行：pre-commit run --hook-stage manual mypy --all-files
      - id: mypy
        stages: [manual]
        args: [--ignore-missing-imports, --show-error-codes]
        exclude: ^(tests/|test/|example/)

  # 安全扫描
  # 与 CI 对齐：quality.yml 跑的是 `bandit -r zoo_framework -c .bandit.yaml`
  # （.bandit.yaml 里 skips: [B101]，并排除 tests/ test/ example/）。
  # 此前钩子写的是 `-c pyproject.toml`——而 pyproject.toml 里并没有 [tool.bandit] 段，
  # 于是 B101 未跳过；又因为没有范围过滤，pre-commit 会把测试文件也交给 bandit，
  # 结果是每个用例里的 assert 都算一条 B101，钩子必然失败。
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        files: ^zoo_framework/
        args: ["-c", ".bandit.yaml"]
        additional_dependencies: ["bandit[toml]"]
