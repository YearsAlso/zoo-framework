[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "zoo-framework-native"
# 0.1.1：0.1.0 的首次发布只上去了 Windows 一份（发布链路的产物 fan-in 缺陷，见
# native/DECISION.md 与 native-release.yml 头部）。索引上的文件名不得重用，0.1.0 那份
# 既不能删（删除不可逆）也不能补名重传，所以缺的两个平台只能靠新版本带出去。
version = "0.1.1"
description = "zoo-framework 原生任务执行扩展（可选安装；未安装时框架一切如旧；内置任务为样例负载，非框架功能）"
requires-python = ">=3.11"

# 下界与主包一致（3.11）。此前写 3.13 的理由是"没有 CI 覆盖、本机也没有在 3.11 上编译
# PyO3 扩展的验证路径"——那个理由随 issue #129 消失：现在有 .github/workflows/native.yml
# 在 3.11 与 3.13 上真实加载同一个 abi3 wheel（见该工作流的 abi3-load 作业）。
# 与 `pyo3` 的 abi3-py311 配套：abi3 的收益（一份 wheel 覆盖多版本）会被自己的下界吃掉，
# 所以两者必须同时改。

# 独立 pyproject：主包（zoo-framework）的构建完全不读本文件；
# wheel 产物是单一 cdylib 扩展模块 zoo_framework_native，安装即得。
