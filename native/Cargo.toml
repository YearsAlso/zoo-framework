[package]
name = "zoo_framework_native"
# 与 pyproject.toml 的 [project].version 同步推进：wheel 的版本号取自后者，但两处声明的
# 版本不一致就是文档级漂移（主包的四处版本声明吃过这个亏，见根 CLAUDE.md）。
version = "0.1.1"
edition = "2021"
description = "zoo-framework 原生任务执行扩展（可选安装，契约版本 1；内置任务为样例负载，非框架功能）"

[lib]
name = "zoo_framework_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311：一次构建覆盖 3.11+，把 wheel 数量从「每 Python 版本一份」压到一份
# （issue #129）。不启用 abi3 时 7 平台 × N 个 Python 版本逐版本重发，且用户 Python
# 比 wheel 新就装不上。
#
# 版本带：0.29（issue #205 由 0.23 升级而来，与 bench/pyo3_probe 对齐）。升级动因是
# 0.23 有 3 条已公开漏洞（high/medium 修于 0.29.0、low 修于 0.24.1），Dependabot
# 全部命中在 native/Cargo.lock 上。边界行为（GIL 释放、panic=unwind 兜底）已按
# native/DECISION.md 的读数边界逐条重测——见「pyo3 0.23 → 0.29 升级」一节。
# 下次升级同样 MUST 重测这三条边界行为。
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }

[profile.release]
# 与 probe 同纪律：panic MUST NOT 导致 Python 进程 abort。
# unwind 保持，PyO3 在 FFI 边界把 panic 转为 PanicException，
# 适配器侧再兜底映射为 NativePanic（contract.py D3 语义）。
panic = "unwind"
opt-level = 3
