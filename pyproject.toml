[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoo-framework"
version = "0.10.5-beta"
description = "Python declarative multi-task orchestration framework powering next-gen Agents and workflows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
authors = [
    {name = "XiangMeng", email = "mengxiang931015@live.com"},
]
keywords = ["framework", "multi-threaded", "async", "state-machine", "event-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.0.0",
    # jinja2 已移除：脚手架模板只用 string.Template 的变量替换，不需要模板引擎
    # gevent 已移除（align-execution-primitives）：事件投递与状态 effect 改用
    # concurrent.futures 线程执行器；greenlet 系在 free-threaded 构建上不可用
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
dev = [
    # 代码质量工具 (P0)
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    # 测试 (P1)
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    # 构建工具
    "build>=1.0.0",
    "twine>=4.0.0",
    # 版本管理
    "bump-my-version>=0.15.0",
    "toml>=0.10.2",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    # API 参考由 docstring 自动生成（mkdocs.yml 的 mkdocstrings 插件）
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
zfc = "zoo_framework.cli:zfc"
zoo = "zoo_framework.cli:zfc"

[project.urls]
Homepage = "https://github.com/YearsAlso/zoo-framework"
Documentation = "https://yearsalso.github.io/zoo-framework/"
Repository = "https://github.com/YearsAlso/zoo-framework"
Issues = "https://github.com/YearsAlso/zoo-framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["zoo_framework"]

# ============================================
# Ruff 配置 (P0: 代码质量工具)
# ============================================
[tool.ruff]
target-version = "py313"  # 仅支持 Python 3.13+
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E", "W",
    # isort
    "I",
    # pydocstyle
    "D",
    # Pyupgrade
    "UP",
    # Flake8-bugbear
    "B",
    # Flake8-simplify
    "SIM",
    # Flake8-comprehensions
    "C4",
    # Flake8-builtins
    "A",
    # Flake8-return
    "RET",
    # Flake8-unused-arguments
    "ARG",
    # Flake8-type-checking
    "TCH",
    # Perflint
    "PERF",
    # Ruff-specific rules
    "RUF",
]
ignore = [
    # 暂时忽略文档字符串规则，后续逐步添加
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D200",  # One-line docstring should fit on one line
    "D205",  # Missing blank line after summary
    "D415",  # First line should end with a period
    # 中文项目允许使用中文字符
    "RUF001",  # Ambiguous unicode character in string
    "RUF002",  # Ambiguous unicode character in docstring
    "RUF003",  # Ambiguous unicode character in comment
    # 其他非关键规则
    "E501",  # Line too long
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "PERF203",  # Try-except within a loop
    "F403",  # Undefined local with import star
    "F405",  # Undefined local with import star usage
    "RUF012",  # Mutable class default
    "RUF013",  # Implicit optional
    "TC001",  # Typing only first party import
    "E721",  # Type comparison
    "E722",  # Bare except
    "B007",  # Unused loop control variable
    "RET503",  # Implicit return
    "RET504",  # Unnecessary assign
    "SIM102",  # Collapsible if
    "PERF102",  # Incorrect dict iterator
    "PERF401",  # Manual list comprehension
    "A001",  # Builtin variable shadowing
    "RUF006",  # Asyncio dangling task
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["zoo_framework"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# 测试文件允许缺少文档字符串和简化断言
"tests/*" = ["D", "S101"]
"test/*" = ["D", "S101"]
"example/*" = ["D"]

# ============================================
# MyPy 配置 (P0: 类型安全)
# ============================================
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 暂时允许，后续逐步添加类型注解
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

# 第三方库缺失类型存根时的处理
ignore_missing_imports = true

# 排除文件
exclude = [
    "build",
    "dist",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

# ============================================
# 分模块严格度（design D3）
# ============================================
# 先只对 `zoo_framework/utils/` 打开"禁止无注解函数"：该模块是纯工具层、被引用的面最广，
# 先把它做成第一个"注解完整"的样板，其余模块仍沿用全局的 disallow_untyped_defs = false。
# 全局打开需要先把全仓库的注解补齐——那是后续逐模块推进的事，不在本变更内。
# 注意 mypy 的 `foo.bar.*` 同时匹配 `foo.bar` 自身与其子模块，故这里覆盖整个 utils 包。
[[tool.mypy.overrides]]
module = ["zoo_framework.utils.*"]
disallow_untyped_defs = true

# ============================================
# Pytest 配置 (P1: 测试覆盖)
# ============================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["zoo_framework"]
omit = [
    "*/tests/*",
    "*/test/*",
    "*/example/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================
# Bump My Version 配置 (自动版本号管理)
# ============================================
[tool.bumpversion]
current_version = "0.8.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "zoo_framework/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
