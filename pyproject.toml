[build-system]
# hatchling 下限 1.27：PEP 639 的 SPDX 许可证表达式（license = "Apache-2.0"）
# 与 license-files 需要该版本起才支持；不设下限时旧后端会拒绝（或静默忽略）字段，
# 产出"构建成功但元数据不合规"的包——把失败前置到构建期。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zoo-framework"
version = "0.10.6-beta"
description = "Python declarative multi-task orchestration framework powering next-gen Agents and workflows"
readme = "README.md"
# PEP 639：许可证用 SPDX 表达式声明（旧写法 license = {text = "..."} 无法被
# PyPI / SBOM / 合规扫描器机器读取），许可证文件由 license-files 列出。
license = "Apache-2.0"
license-files = ["LICENSE"]
# 下界取 3.11：由扫描证据与"在下界解释器上实跑全量测试"共同支撑，依据与复核方式见
# docs/contributing/development.md 的「Python 下界的依据」一节。提高门槛 MUST 先在该节
# 写下依据。工具链 target（ruff / mypy）、uv.lock、CI 测试矩阵与文档门槛声明都跟随此值，
# 由 tests/test_doc_consistency.py 守住"同源"。
requires-python = ">=3.11"
authors = [
    {name = "XiangMeng", email = "mengxiang931015@live.com"},
]
keywords = [
    # 任务调度 / 后台任务
    "task-scheduler",
    "background-jobs",
    "task-orchestration",
    "orchestration",
    "job-scheduling",
    # 并发 / 线程
    "multi-threaded",
    "threading",
    "concurrency",
    "thread-pool",
    "in-process",
    # AI Agent 基础设施
    "agent",
    "agent-framework",
    "llm",
    "ai-agents",
    "workflow-automation",
    # 领域能力（保留原有）
    "framework",
    "async",
    "state-machine",
    "event-driven",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 许可证 classifier 已按 PEP 639 删除：SPDX 表达式与许可证 classifier 并存时
    # 工具会报错，且前者是可机器读取的真源（docs/REPO_METADATA.md 的必须清单不含它）
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # classifiers 列出 requires-python 覆盖的**整段区间**：这是"声明支持"，
    # 不等同于"CI 实测过"（实测集合见 .github/workflows/tests.yml 的矩阵）。
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "click>=8.0.0",
    # jinja2 已移除：脚手架模板只用 string.Template 的变量替换，不需要模板引擎
    # gevent 已移除（align-execution-primitives）：事件投递与状态 effect 改用
    # concurrent.futures 线程执行器；greenlet 系在 free-threaded 构建上不可用
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # typing-extensions 已移除（python-floor）：全仓 0 处 import，却被声明为运行依赖
    # 并计入文档的"运行时依赖 4 个"。声明必须与实际使用一致，见
    # openspec/specs/ci-and-packaging 的「运行时依赖 MUST 与实际使用一致」。
]

[project.optional-dependencies]
dev = [
    # 代码质量工具 (P0)
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    # 测试 (P1)
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    # 构建工具
    "build>=1.0.0",
    "twine>=4.0.0",
    "toml>=0.10.2",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    # API 参考由 docstring 自动生成（mkdocs.yml 的 mkdocstrings 插件）
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
zfc = "zoo_framework.cli:zfc"
zoo = "zoo_framework.cli:zfc"

[project.urls]
Homepage = "https://github.com/YearsAlso/zoo-framework"
Documentation = "https://yearsalso.github.io/zoo-framework-doc/"
Repository = "https://github.com/YearsAlso/zoo-framework"
Issues = "https://github.com/YearsAlso/zoo-framework/issues"
Changelog = "https://github.com/YearsAlso/zoo-framework/blob/main/CHANGELOG.md"
Benchmark = "https://yearsalso.github.io/zoo-bench/"

[tool.hatch.build.targets.wheel]
packages = ["zoo_framework"]

# ============================================
# Ruff 配置 (P0: 代码质量工具)
# ============================================
[tool.ruff]
target-version = "py311"  # 跟随 requires-python：按项目声明的下界检查语法
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E", "W",
    # isort
    "I",
    # pydocstyle
    "D",
    # Pyupgrade
    "UP",
    # Flake8-bugbear
    "B",
    # Flake8-simplify
    "SIM",
    # Flake8-comprehensions
    "C4",
    # Flake8-builtins
    "A",
    # Flake8-return
    "RET",
    # Flake8-unused-arguments
    "ARG",
    # Flake8-type-checking
    "TCH",
    # Perflint
    "PERF",
    # Ruff-specific rules
    "RUF",
]
ignore = [
    # 暂时忽略文档字符串规则，后续逐步添加
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D200",  # One-line docstring should fit on one line
    "D205",  # Missing blank line after summary
    "D415",  # First line should end with a period
    # 中文项目允许使用中文字符
    "RUF001",  # Ambiguous unicode character in string
    "RUF002",  # Ambiguous unicode character in docstring
    "RUF003",  # Ambiguous unicode character in comment
    # 其他非关键规则
    "E501",  # Line too long
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "PERF203",  # Try-except within a loop
    "F403",  # Undefined local with import star
    "F405",  # Undefined local with import star usage
    "RUF012",  # Mutable class default
    "RUF013",  # Implicit optional
    "TC001",  # Typing only first party import
    "E721",  # Type comparison
    "E722",  # Bare except
    "B007",  # Unused loop control variable
    "RET503",  # Implicit return
    "RET504",  # Unnecessary assign
    "SIM102",  # Collapsible if
    "PERF102",  # Incorrect dict iterator
    "PERF401",  # Manual list comprehension
    "A001",  # Builtin variable shadowing
    "RUF006",  # Asyncio dangling task
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["zoo_framework"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# 测试文件允许缺少文档字符串和简化断言
"tests/*" = ["D", "S101"]
"test/*" = ["D", "S101"]
"example/*" = ["D"]

# ============================================
# MyPy 配置 (P0: 类型安全)
# ============================================
[tool.mypy]
# 跟随 requires-python：按项目声明的下界决定标准库存根
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 暂时允许，后续逐步添加类型注解
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

# 第三方库缺失类型存根时的处理
ignore_missing_imports = true

# 排除文件
exclude = [
    "build",
    "dist",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

# ============================================
# 分模块严格度（design D3）
# ============================================
# 先只对 `zoo_framework/utils/` 打开"禁止无注解函数"：该模块是纯工具层、被引用的面最广，
# 先把它做成第一个"注解完整"的样板，其余模块仍沿用全局的 disallow_untyped_defs = false。
# 全局打开需要先把全仓库的注解补齐——那是后续逐模块推进的事，不在本变更内。
# 注意 mypy 的 `foo.bar.*` 同时匹配 `foo.bar` 自身与其子模块，故这里覆盖整个 utils 包。
[[tool.mypy.overrides]]
module = ["zoo_framework.utils.*"]
disallow_untyped_defs = true

# ============================================
# Pytest 配置 (P1: 测试覆盖)
# ============================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["zoo_framework"]
omit = [
    "*/tests/*",
    "*/test/*",
    "*/example/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
