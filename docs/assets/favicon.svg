<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Zoo Framework">
  <title>Zoo Framework</title>
  <!-- 小尺寸专用变体（favicon / 列表缩略图 / 头像）。
       细描边在 16px 下会糊成一团，故改用「实底 + 挖空条」：
       实心色块的边缘对比度远高于细线，在 16px 与深色模式下都成立。 -->
  <rect width="32" height="32" rx="7" fill="#223344"/>
  <g stroke-linecap="round">
    <rect x="8.5" y="12" width="3.6" height="11" rx="1.8" fill="#C9D6DE"/>
    <rect x="14.2" y="8.5" width="3.6" height="14.5" rx="1.8" fill="#33aa99"/>
    <rect x="19.9" y="15" width="3.6" height="8" rx="1.8" fill="#C9D6DE"/>
  </g>
</svg>
