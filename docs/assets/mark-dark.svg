<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="Zoo Framework">
  <title>Zoo Framework</title>
  <!-- 环 = 生命周期 / 容器作用域；三条不等高的条 = 同一调度器下负载不同的 Worker。
       几何与基准柱状图同形，形成项目内部视觉一致。
       刻意不使用拟人化/动物插画：受众是开发者与 AI agent 平台，且标识须在 16px 下可辨。 -->
  <circle cx="52" cy="52" r="40" fill="none" stroke="#C9D6DE" stroke-width="7"/>
  <g stroke-linecap="round">
    <rect x="31.5" y="40" width="9" height="34" rx="4.5" fill="#C9D6DE"/>
    <rect x="47.5" y="30" width="9" height="44" rx="4.5" fill="#7FD6C4"/>
    <rect x="63.5" y="50" width="9" height="24" rx="4.5" fill="#C9D6DE"/>
  </g>
</svg>
