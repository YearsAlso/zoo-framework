# P1: CI/CD 增强 - 代码质量检查
# 整合 Ruff + MyPy + Pylint

name: Quality Check

on:
  push:
    branches: [ main, dev, feat-* ]
  pull_request:
    branches: [ main, dev ]

# Scorecard Token-Permissions 满分标准：顶层只读，需要写的作业在 job 级声明
# （本工作流纯只读，无需任何 job 级 write）
permissions:
  contents: read

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pylint==2.17.4

      # Ruff 代码检查和格式化（快速）
      - name: Run Ruff linter
        run: ruff check zoo_framework --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check zoo_framework

      # Pylint 详细检查（使用项目配置）
      - name: Run Pylint
        run: |
          if [ -f "pylint.conf" ]; then
            echo "使用 pylint.conf 配置"
            python -m pylint zoo_framework --rcfile=pylint.conf --exit-zero
          else
            echo "使用默认配置"
            python -m pylint zoo_framework --exit-zero
          fi

      # MyPy 类型检查（门禁：0 error 已达成，故不再 continue-on-error）
      - name: Run MyPy type check
        run: mypy zoo_framework --show-error-codes

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      # 门禁：不再用 `|| true` 吞掉失败（变更 establish-type-gate 6.5）。
      # 按 CI 实际安装的版本复核过：CI 装的是 `bandit[toml]`（**未钉版本 ⇒ 最新**，
      # 实测 1.9.4），而本地 pre-commit 钩子钉的是 1.7.6 —— 两版结论曾**不一致**，
      # 故必须以 CI 那版为准（与 4.1 的 mypy 是同一族问题）。复核时该版曾报 3 条
      # pickle 发现（state_machine_work.py），已按 persistence_scheduler.py 的既有做法
      # 用带说明的 `# nosec` 处置，现该版退出码为 0。
      - name: Run Bandit security scan
        run: bandit -r zoo_framework -c .bandit.yaml -f json -o bandit-report.json

      # 报告仍无条件上传：门禁失败时更需要这份报告来定位。故上游的 `|| true` 去掉、
      # 这里的 `if: always()` 保留 —— 两者是一对，不是同一处。
      - name: Upload Bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()
