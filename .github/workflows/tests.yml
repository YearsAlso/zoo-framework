# P1: 测试覆盖增强
# 多版本 Python 测试 + 覆盖率报告

name: Tests

on:
  push:
    branches: [ main, dev, feat-* ]
  pull_request:
    branches: [ main, dev ]

# Scorecard Token-Permissions：顶层只读；本工作流纯只读（codecov 报告走其自身的 OIDC）
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=zoo_framework --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=30

      - name: Upload coverage report
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457  # v3
        # codecov v3 经 GITHUB_TOKEN 上传；若以后升级 v4+ 需补 CODECOV_TOKEN
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        if: matrix.os == 'ubuntu-latest'

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
        if: always()

  # 说明：此处原有一个 `benchmark` 作业，已删除（变更 establish-type-gate 6.4）。
  # 它 `run: pytest tests/benchmarks/ ...`，而 **`tests/benchmarks/` 自始至终不存在**
  # （全仓库也没有任何 pytest-benchmark 用例、`benchmark` marker 也未配置），
  # 且该步骤带 `continue-on-error: true`，故它从未门禁过任何东西。
  # **不要把它与仓库根真实的 `bench/` 混淆**：后者是 `adopt-rust-core` 的独立测量脚本
  # （Rust/PyO3 探针与对比脚本），不是 pytest 基准，也不在 CI 中运行。
  # 未改用法是"加目录存在性条件"：`hashFiles()` 在**作业级** `if:` 上求值时尚未 checkout、
  # 工作区为空，条件恒假、作业恒跳过——那只是把死作业换成"永远跳过的作业"，不如删除诚实。
