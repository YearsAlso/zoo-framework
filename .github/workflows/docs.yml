# 📚 文档自动部署
#
# 功能：
# 1. 构建文档
# 2. 部署到 GitHub Pages
#
# 触发条件：
# - main 分支的 docs/ 目录有变更
# - 手动触发

name: 📚 Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 如果使用 MkDocs
      - name: Build with MkDocs
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build
        if: hashFiles('mkdocs.yml') != ''

      # 如果使用 VitePress（文档项目）
      # 这部分在 docs 仓库中处理

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
        # 与上一步同条件：构建被跳过时 ./site 不会产生，此时上传必然失败。
        # 原先只有构建步骤带条件、上传步骤不带——即"条件加在主动作上、未加在依赖它的
        # 后续步骤上"（变更 establish-type-gate 6.2/6.5 要消除的那种不对称）。
        if: hashFiles('mkdocs.yml') != ''

  deploy:
    name: 部署到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
