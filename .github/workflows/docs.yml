# 📚 文档自动部署
#
# 功能：
# 1. 构建文档
# 2. 部署到 GitHub Pages
#
# 触发条件：
# - main / dev 分支的文档相关路径有变更
# - 面向 dev 的 PR 有文档相关路径变更（只构建、不部署——构建即 --strict 门禁）
# - 手动触发
#
# 构建与部署分离：`build` 在任何触发上都跑（--strict，告警即失败），`deploy` 只在
# main 上执行。dev / PR 因此能拦住文档告警，而 GitHub Pages 仍只发布 main 的内容。
#
# `.well-known/**` 与 `llms.txt` 必须列入触发路径：这两个文件被 mkdocs 构建钩子复制进
# 站点产物（见 mkdocs.yml 的 hooks），若只改它们的内容（例如续期 Expires、
# 更新 llms.txt 的链接）却不触发本工作流，已发布的站点会一直带着旧文件。

name: 📚 Deploy Documentation

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - '.well-known/**'
      - 'llms.txt'
      - 'README.md'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.well-known/**'
      - 'llms.txt'
      - 'README.md'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Scorecard Token-Permissions：顶层只读；写权限（pages/id-token）在用到它的 deploy
# 作业级声明——原顶层写法违反最小权限（顶层一旦放宽，新增作业即默认继承）
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 构建文档
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      # 如果使用 MkDocs
      - name: Build with MkDocs
        run: |
          # mkdocstrings 用于从 docstring 生成 API 参考（见 mkdocs.yml 的 plugins）
          pip install mkdocs mkdocs-material 'mkdocstrings[python]>=0.25'
          # --strict：链接告警与 griffe 签名告警一律失败（issue #141）
          mkdocs build --strict
        if: hashFiles('mkdocs.yml') != ''

      # 如果使用 VitePress（文档项目）
      # 这部分在 docs 仓库中处理

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: ./site
        # 与上一步同条件：构建被跳过时 ./site 不会产生，此时上传必然失败。
        # 原先只有构建步骤带条件、上传步骤不带——即"条件加在主动作上、未加在依赖它的
        # 后续步骤上"（变更 establish-type-gate 6.2/6.5 要消除的那种不对称）。
        if: hashFiles('mkdocs.yml') != ''

  deploy:
    name: 部署到 GitHub Pages
    # 只从 main 发布：dev / PR 的构建是门禁，产物不上站点
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Pages 部署的最小写权限（顶层已收紧为 read-all，写权限只能在这里声明）
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
