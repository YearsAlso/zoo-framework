# 🚀 自动化发布工作流（tag 驱动 + 版本号走 PR）
#
# 版本策略：
# - dev 分支: 测试版本，patch 自增 (0.5.3-beta → 0.5.4-beta)
# - main 分支: 正式版本，minor 自增 (0.5.x → 0.6.0)
#
# 三条触发路径：
# 1) push 到 dev/main 且有改动（非"仅版本声明"）→ 算出版本、改三处版本声明 → 开/更新 bump PR
# 2) push 到 dev/main 且**只**改了版本声明（即 bump PR 刚被合并）→ 自动创建并推送 tag v<版本>
# 3) push tag v* → 测试 → 代码质量检查 → 构建 → 发布 PyPI → 创建 GitHub Release
#
# 为什么不是"推送即发布"（以下三条是实测的分支保护设置，不是假设）：
# - dev/main 受保护且 **lock_branch: true** → 锁定分支，工作流用 GITHUB_TOKEN 无法回写版本号；
# - **required_signatures: true** → 提交必须签名，故 bump 提交经 API 产生
#   （create-pull-request 的 sign-commits），而不是 git commit；
# - **required_approving_review_count: 1** → bump PR 需 1 个批准；这是发布闸门的一部分。
# tag 推送是唯一的发布闸门，且 tag 不受分支保护约束，故能由工作流直接推送。
#
# 🔑 Secrets：
# - RELEASE_PAT：**仅 bump PR 用**。不能用 GITHUB_TOKEN 代替 —— 本仓库的
#   can_approve_pull_request_reviews 为 false，Actions 建的 PR 会被平台拒绝
#   （实测报 "GitHub Actions is not permitted to create or approve pull requests."）。
#   需要 fine-grained PAT：Contents: write + Pull requests: write，仓库限本仓库。
#   刻意不开 can_approve_pull_request_reviews：那会同时赋予 Actions "批准 PR" 的能力，
#   于是 required_approving_review_count: 1 这道闸门只靠 YAML 自觉，而不是平台强制。
# - PYPI_API_TOKEN：发布到 PyPI（当前该 secret 未配置，实际走 OIDC trusted publishing，
#   见下方 release 作业的说明）
# 🔑 权限：contents: write（推分支/tag）、pull-requests: write（开 PR）、id-token: write（OIDC）

name: 🚀 Release

concurrency:
  # 同一 ref 串行：两个快速连续的 push 不会各开一个 bump PR
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  # 分支推送与 tag 推送都触发；**路径过滤刻意不写在这里**。
  # 原因（实测）：把 branches / paths / tags 三者放进同一个 push 下会让过滤互相干扰 ——
  # 本文件曾这样写，结果一次同时触及 pyproject.toml 与 release.yml 的推送**没有触发**本
  # 工作流（同一时刻另一条不触碰这些路径的推送反而触发了旧版）。注意本地 actionlint 只验
  # schema，验不到这种语义交互。
  # 等价过滤改在 decide 作业内做（见「与旧版 paths: 等价的相关性判定」）。
  push:
    branches: [dev, main]
    tags:
      - 'v*'

jobs:
  # ─── 路径 1/2 的分流：这次分支推送该"开 bump PR"还是"打 tag" ───
  decide:
    name: 🔍 判定动作
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.classify.outputs.action }}
      branch: ${{ steps.classify.outputs.branch }}
      version_type: ${{ steps.classify.outputs.version_type }}
      release_type: ${{ steps.classify.outputs.release_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 分类这次推送
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          BRANCH="$GITHUB_REF_NAME"

          case "$BRANCH" in
            dev)
              VERSION_TYPE="patch"; RELEASE_TYPE="beta" ;;
            main)
              VERSION_TYPE="minor"; RELEASE_TYPE="stable" ;;
            *)
              echo "::error::本工作流只应作用于 dev/main，收到 $BRANCH"
              exit 1 ;;
          esac

          # 与旧版 `paths:` 等价的相关性判定（paths 已从触发条件移到此处，理由见文件头）：
          # 本次推送若未触及发布相关路径，则不进入任何动作。
          ACTION="none"
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > /tmp/changed.txt 2>/dev/null; then
            if [ -s /tmp/changed.txt ]; then
              RELEVANT=0
              while IFS= read -r f; do
                case "$f" in
                  zoo_framework/*|pyproject.toml|.env|.github/workflows/release.yml) RELEVANT=1 ;;
                esac
              done < /tmp/changed.txt

              if [ "$RELEVANT" = "1" ]; then
                # 判定是否"只改了三处版本声明"——那正是 bump PR 刚被合并的样子。
                # 这个判定同时是自环防护：bump 合并后不会再开出一个新的 bump PR。
                ACTION="bump"
                ONLY_VERSION=1
                while IFS= read -r f; do
                  case "$f" in
                    pyproject.toml|.env|zoo_framework/__init__.py) ;;
                    *) ONLY_VERSION=0 ;;
                  esac
                done < /tmp/changed.txt
                if [ "$ONLY_VERSION" = "1" ]; then ACTION="tag"; fi
              else
                echo "本次推送未触及发布相关路径，不动作"
              fi
            fi
          else
            echo "⚠️ 无法与 $BEFORE_SHA 比较（可能是首次推送），按 bump 处理"
            ACTION="bump"
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "本次推送 → $ACTION（分支 $BRANCH，版本类型 $VERSION_TYPE / $RELEASE_TYPE）"

  # ─── 路径 1：算版本 → 改三处声明 → 开/更新 bump PR（不发布）───
  open-bump-pr:
    name: 📝 开/更新版本号 PR
    needs: decide
    if: needs.decide.outputs.action == 'bump'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本: $CURRENT_VERSION"

      - name: Calculate new version
        id: calc_version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          VERSION_TYPE: ${{ needs.decide.outputs.version_type }}
          RELEASE_TYPE: ${{ needs.decide.outputs.release_type }}
        run: |
          echo "当前版本: $CURRENT_VERSION / 版本类型: $VERSION_TYPE / 发布类型: $RELEASE_TYPE"

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3 | cut -d- -f1)

          if [ "$VERSION_TYPE" == "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          else
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            if [ "$RELEASE_TYPE" == "beta" ]; then
              NEW_VERSION="${NEW_VERSION}-beta"
            fi
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "新版本: $NEW_VERSION"

      - name: Update version declarations
        env:
          NEW_VERSION: ${{ steps.calc_version.outputs.new_version }}
        run: |
          # 三处版本声明必须一起改；少改一处就会出现"发出的包对自己的版本撒谎"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/^VERSION=.*/VERSION=$NEW_VERSION/" .env
          sed -i "s/^\([[:space:]]*\)__version__ = \".*\"/\1__version__ = \"$NEW_VERSION\"/" zoo_framework/__init__.py

          echo "--- 改动后核对（三处必须一致）---"
          grep -n '^version = ' pyproject.toml
          grep -n '^VERSION=' .env
          grep -n '__version__ = ' zoo_framework/__init__.py | head -1

          # 断言三处都写成了新版本号，否则就地失败——不要开出一个错的 PR
          for f in pyproject.toml .env zoo_framework/__init__.py; do
            grep -q "$NEW_VERSION" "$f" || { echo "::error::$f 未写入新版本号 $NEW_VERSION"; exit 1; }
          done

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # 用 PAT 而非 GITHUB_TOKEN：GITHUB_TOKEN 建 PR 会被平台拒绝（见文件头的
          # RELEASE_PAT 说明）。副作用是这件事变好了 —— 由 PAT 建的 PR 会正常触发
          # pull_request 事件上的检查工作流，而 GITHUB_TOKEN 建的 PR 不会触发任何新运行。
          token: ${{ secrets.RELEASE_PAT }}
          base: ${{ needs.decide.outputs.branch }}
          branch: release/bump-${{ steps.calc_version.outputs.new_version }}
          # 分支保护要求提交签名；经 API 产生的提交由 GitHub 签名，git commit 产生的不是
          sign-commits: true
          add-paths: |
            pyproject.toml
            .env
            zoo_framework/__init__.py
          commit-message: "chore(release): bump version to ${{ steps.calc_version.outputs.new_version }} [skip ci]"
          title: "chore(release): 版本号升到 ${{ steps.calc_version.outputs.new_version }}"
          body: |
            `dev` / `main` 是受保护且**已锁定**的分支，工作流无法直接回写版本号，故版本改动经此 PR 提交。

            - 目标分支：`${{ needs.decide.outputs.branch }}`
            - 新版本：`${{ steps.calc_version.outputs.new_version }}`（${{ needs.decide.outputs.version_type }} 自增）
            - 本 PR 由机器人提交，提交已签名（满足分支保护的签名要求），但仍需人工批准与合并。
            - **合并后**：本工作流会自动创建并推送 `v${{ steps.calc_version.outputs.new_version }}`，
              该 tag 推送将触发 测试 → 质量检查 → 构建 → 发布 PyPI → 创建 GitHub Release。
          delete-branch: true

  # ─── 路径 2：bump PR 刚合并 → 自动打 tag（tag 推送再触发路径 3）───
  tag-release:
    name: 🏷️ 打 tag
    needs: decide
    if: needs.decide.outputs.action == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: 创建并推送 tag
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG 已存在，中止（不改写既有 tag）"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "已推送 tag $TAG —— 它将触发 测试 / 质量检查 / 构建 / 发布"

  # ─── 路径 3：tag 推送 → 测试 → 质量 → 构建 → 发布 ───
  test:
    name: 🧪 运行测试
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=zoo_framework --cov-report=xml --cov-fail-under=30

  quality:
    name: 🔍 代码质量检查
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check zoo_framework

      # 与独立的 quality.yml 对齐：mypy 在两边都是硬门禁 —— quality.yml 那侧的
      # continue-on-error 已由变更 establish-type-gate 的 4.1 移除，此处随之移除
      # （原先的注释写着"mypy 不卡门禁"，那个前提已经不存在了）。
      - name: Run MyPy
        run: mypy zoo_framework

  release:
    name: 🚀 发布
    # 发布 MUST 以测试与质量检查为前提（变更 4.2 的验收条件就落在这条 needs 链上）
    needs: [test, quality]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zoo-framework/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build toml

      - name: 校验 tag 与声明的版本一致
        id: version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "tag=$GITHUB_REF_NAME / pyproject=$VERSION"
          # 两者必须同源，否则会发出一个"标签与版本对不上"的 release
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 pyproject.toml 的版本 ($VERSION) 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 刻意不传 password：OIDC trusted publishing 的触发条件就是
        # `user == __token__`（该 action 的 user 输入默认值）且 password 为空 ——
        # 见 twine-upload.sh 的 `[[ "${INPUT_USER}" == "__token__" && -z "${INPUT_PASSWORD}" ]]`。
        # 原先这里写 `password: ${{ secrets.PYPI_API_TOKEN }}`，但本仓库并无该 secret
        # （gh secret list 只有 PYPI），故它一直解析为空值、走的本来就是 OIDC；写在这里
        # 只会误导。若确实想改用 API token，需在 PyPI 账号侧签发 token 并加成本仓库的
        # secret 后再传 password —— 反之，一旦有人误加同名 secret，认证方式就会从 OIDC
        # 悄悄切回 token，而 OIDC 是更推荐的做法。

      - name: Generate Changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            CHANGELOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 🎉 Release ${{ github.ref_name }}

            **类型:** ${{ contains(github.ref_name, '-beta') && '🧪 测试版本' || '🚀 正式版本' }}
            **版本:** `${{ steps.version.outputs.version }}`

            ### 📋 变更记录
            ${{ steps.changelog.outputs.changelog }}

            ### 📦 安装

            ```bash
            pip install zoo-framework==${{ steps.version.outputs.version }}
            ```

            ### 📚 文档
            - [开发文档](https://github.com/${{ github.repository }}/blob/main/docs/README.md)
            - [API 参考](https://github.com/${{ github.repository }}/blob/main/docs/API_REFERENCE.md)
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Success
        run: |
          echo "🎉 发布成功！"
          echo "版本: ${{ github.ref_name }}"
          echo "PyPI: https://pypi.org/project/zoo-framework/${{ steps.version.outputs.version }}/"
