# 🚀 自动化发布工作流（tag 驱动 + 版本号走 PR）
#
# 版本策略：
# - dev 分支: 测试版本，patch 自增 (0.5.3-beta → 0.5.4-beta)；计算以 main 声明为**下限**
#   （scripts/next_version.py，#82：防双分支版本线分叉再发）
# - main 分支: 正式版本，minor 自增 (0.5.x → 0.6.0)
#
# 四条触发路径：
# 1) push 到 dev/main 且有改动（非"仅版本声明"）→ 算出版本、改三处版本声明 → 开/更新 bump PR
# 2) push 到 dev/main 且**只**改了版本声明（即 bump PR 刚被合并）→ 自动创建并推送 tag v<版本>
#    （例外：dev 的三处声明与 main 完全一致时是 back-merge 回声，不动作——见 decide）
# 3) push tag v* → 测试 → 代码质量检查 → 构建 → 发布 PyPI → 创建 GitHub Release
# 4) main 的 bump 合并（路径 2 在 main 上成立）→ 自动向 dev 开 back-merge PR，
#    使 dev 版本声明跟上 main（#82 的治根因一环；仍需人工批准合并）
#
# 为什么不是"推送即发布"（以下三条是实测的分支保护设置，不是假设）：
# - dev/main 受保护且 **lock_branch: true** → 锁定分支，工作流用 GITHUB_TOKEN 无法回写版本号；
# - **required_signatures: true** → 提交必须签名，故 bump 提交经 API 产生
#   （create-pull-request 的 sign-commits），而不是 git commit；
# - **required_approving_review_count: 1** → bump PR 需 1 个批准；这是发布闸门的一部分。
# tag 推送是唯一的发布闸门，且 tag 不受分支保护约束，故能由工作流直接推送。
#
# 🔑 Secrets：
# - RELEASE_PAT：**两处都用**，都不能用 GITHUB_TOKEN 代替：
#   (a) 开/更新版本号 PR —— 本仓库 can_approve_pull_request_reviews 为 false，
#       Actions 建的 PR 会被平台拒绝（实测报 "GitHub Actions is not permitted to
#       create or approve pull requests."）。刻意不开那个开关：它会同时赋予 Actions
#       "批准 PR" 的能力，于是 required_approving_review_count: 1 这道闸门就只靠 YAML
#       自觉，而不是平台强制。
#   (b) **推送 tag** —— GitHub 的防递归规则：用 GITHUB_TOKEN 推送所产生的事件
#       **不会再触发工作流**。曾因此静默断链：tag 建出来了，但「路径 3」的
#       测试/质量/构建/发布一个都没被启动（0.8.0 首发实测：tag 存在、PyPI 404、
#       且没有任何以该 tag 为 ref 的运行）。改用 PAT 推送即正常触发。
# - PYPI_API_TOKEN：发布到 PyPI（当前该 secret 未配置，实际走 OIDC trusted publishing，
#   见下方 release 作业的说明）
# 🔑 权限：contents: write（推分支/tag）、pull-requests: write（开 PR）、id-token: write（OIDC）

name: 🚀 Release

concurrency:
  # 同一 ref 串行：两个快速连续的 push 不会各开一个 bump PR
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  # 分支推送与 tag 推送都触发；**路径过滤刻意不写在这里**。
  # 原因（实测）：把 branches / paths / tags 三者放进同一个 push 下会让过滤互相干扰 ——
  # 本文件曾这样写，结果一次同时触及 pyproject.toml 与 release.yml 的推送**没有触发**本
  # 工作流（同一时刻另一条不触碰这些路径的推送反而触发了旧版）。注意本地 actionlint 只验
  # schema，验不到这种语义交互。
  # 等价过滤改在 decide 作业内做（见「与旧版 paths: 等价的相关性判定」）。
  push:
    branches: [dev, main]
    tags:
      - 'v*'

# Scorecard Token-Permissions 满分标准：顶层只读，write 权限按作业最小声明。
# 各作业所需写权限（contents: write / pull-requests: write / id-token: write）
# 已在各作业级逐个声明——顶层一旦放宽，新增作业即默认继承过大权限。
permissions:
  contents: read

jobs:
  # ─── 路径 1/2 的分流：这次分支推送该"开 bump PR"还是"打 tag" ───
  decide:
    name: 🔍 判定动作
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    # 只读：decide 只算分类，不回写
    permissions: {}
    outputs:
      action: ${{ steps.classify.outputs.action }}
      branch: ${{ steps.classify.outputs.branch }}
      version_type: ${{ steps.classify.outputs.version_type }}
      release_type: ${{ steps.classify.outputs.release_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: 分类这次推送
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          BRANCH="$GITHUB_REF_NAME"

          case "$BRANCH" in
            dev)
              VERSION_TYPE="patch"; RELEASE_TYPE="beta" ;;
            main)
              VERSION_TYPE="minor"; RELEASE_TYPE="stable" ;;
            *)
              echo "::error::本工作流只应作用于 dev/main，收到 $BRANCH"
              exit 1 ;;
          esac

          # 与旧版 `paths:` 等价的相关性判定（paths 已从触发条件移到此处，理由见文件头）：
          # 本次推送若未触及发布相关路径，则不进入任何动作。
          ACTION="none"
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > /tmp/changed.txt 2>/dev/null; then
            if [ -s /tmp/changed.txt ]; then
              RELEVANT=0
              while IFS= read -r f; do
                case "$f" in
                  zoo_framework/*|pyproject.toml|.env|.github/workflows/release.yml) RELEVANT=1 ;;
                esac
              done < /tmp/changed.txt

              if [ "$RELEVANT" = "1" ]; then
                # 判定是否"只改了三处版本声明"——那正是 bump PR 刚被合并的样子。
                # 这个判定同时是自环防护：bump 合并后不会再开出一个新的 bump PR。
                ACTION="bump"
                ONLY_VERSION=1
                while IFS= read -r f; do
                  case "$f" in
                    pyproject.toml|.env|zoo_framework/__init__.py) ;;
                    *) ONLY_VERSION=0 ;;
                  esac
                done < /tmp/changed.txt
                if [ "$ONLY_VERSION" = "1" ]; then ACTION="tag"; fi

                # 声明回声检测（#82 路径 2 例外）：dev 推送只改了三处声明、且改完与
                # origin/main 完全一致——那是 back-merge PR 入 dev 的回声，不是 dev 自己
                # 的 bump。不打 tag：同版本号 tag 已存在于 main，撞上 tag-release 的
                # "已存在则中止"守卫只会留下红色失败。正常 dev bump 后声明必领先 main，
                # 此规则不误杀。
                if [ "$ACTION" = "tag" ] && [ "$BRANCH" = "dev" ] \
                   && [ -z "$(git diff origin/main HEAD -- pyproject.toml .env zoo_framework/__init__.py)" ]; then
                  ACTION="none"
                  echo "dev 三处声明与 origin/main 一致：back-merge 回声，不打 tag"
                fi
              else
                echo "本次推送未触及发布相关路径，不动作"
              fi
            fi
          else
            echo "⚠️ 无法与 $BEFORE_SHA 比较（可能是首次推送），按 bump 处理"
            ACTION="bump"
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version_type=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "本次推送 → $ACTION（分支 $BRANCH，版本类型 $VERSION_TYPE / $RELEASE_TYPE）"

  # ─── 路径 1：算版本 → 改三处声明 → 开/更新 bump PR（不发布）───
  open-bump-pr:
    name: 📝 开/更新版本号 PR
    needs: decide
    if: needs.decide.outputs.action == 'bump'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本: $CURRENT_VERSION"

      - name: Calculate new version
        id: calc_version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          VERSION_TYPE: ${{ needs.decide.outputs.version_type }}
          RELEASE_TYPE: ${{ needs.decide.outputs.release_type }}
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: |
          echo "当前版本: $CURRENT_VERSION / 版本类型: $VERSION_TYPE / 发布类型: $RELEASE_TYPE"

          # 递增语义 + 下限抬升收敛到仓内脚本（可被 pytest 覆盖）。
          # dev 传 main 的当前声明作 floor（#82：即使 back-merge PR 被漏合，
          # 也算不出低于 main 的版本）；main 自身不需下限。
          FLOOR=""
          if [ "$BRANCH" = "dev" ]; then
            git show origin/main:pyproject.toml > /tmp/main_pyproject.toml
            FLOOR=$(python -c "import toml; print(toml.load('/tmp/main_pyproject.toml')['project']['version'])")
            echo "下限（main 当前声明）: $FLOOR"
          fi

          if [ -n "$FLOOR" ]; then
            NEW_VERSION=$(python scripts/next_version.py --current "$CURRENT_VERSION" --type "$VERSION_TYPE" --release "$RELEASE_TYPE" --floor "$FLOOR")
          else
            NEW_VERSION=$(python scripts/next_version.py --current "$CURRENT_VERSION" --type "$VERSION_TYPE" --release "$RELEASE_TYPE")
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "新版本: $NEW_VERSION"

      - name: Update version declarations
        env:
          NEW_VERSION: ${{ steps.calc_version.outputs.new_version }}
        run: |
          # 四处版本声明必须一起改；少改一处就会出现"发出的包对自己的版本撒谎"
          # （CITATION.cff 的 version 是第四处，自 packaging-standards / #119 起纳入）
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/^VERSION=.*/VERSION=$NEW_VERSION/" .env
          sed -i "s/^\([[:space:]]*\)__version__ = \".*\"/\1__version__ = \"$NEW_VERSION\"/" zoo_framework/__init__.py
          # CFF 的 `version:` 字段（锚定行首，不会误匹配 `cff-version:`）
          sed -i "s/^version: \".*\"/version: \"$NEW_VERSION\"/" CITATION.cff

          echo "--- 改动后核对（四处必须一致）---"
          grep -n '^version = ' pyproject.toml
          grep -n '^VERSION=' .env
          grep -n '__version__ = ' zoo_framework/__init__.py | head -1
          grep -n '^version: ' CITATION.cff

          # 断言四处都写成了新版本号，否则就地失败——不要开出一个错的 PR
          for f in pyproject.toml .env zoo_framework/__init__.py CITATION.cff; do
            grep -q "$NEW_VERSION" "$f" || { echo "::error::$f 未写入新版本号 $NEW_VERSION"; exit 1; }
          done

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          # 用 PAT 而非 GITHUB_TOKEN：GITHUB_TOKEN 建 PR 会被平台拒绝（见文件头的
          # RELEASE_PAT 说明）。副作用是这件事变好了 —— 由 PAT 建的 PR 会正常触发
          # pull_request 事件上的检查工作流，而 GITHUB_TOKEN 建的 PR 不会触发任何新运行。
          token: ${{ secrets.RELEASE_PAT }}
          base: ${{ needs.decide.outputs.branch }}
          branch: release/bump-${{ steps.calc_version.outputs.new_version }}
          # 分支保护要求提交签名；经 API 产生的提交由 GitHub 签名，git commit 产生的不是
          sign-commits: true
          add-paths: |
            pyproject.toml
            .env
            zoo_framework/__init__.py
          commit-message: "chore(release): bump version to ${{ steps.calc_version.outputs.new_version }} [skip ci]"
          title: "chore(release): 版本号升到 ${{ steps.calc_version.outputs.new_version }}"
          body: |
            `dev` / `main` 是受保护且**已锁定**的分支，工作流无法直接回写版本号，故版本改动经此 PR 提交。

            - 目标分支：`${{ needs.decide.outputs.branch }}`
            - 新版本：`${{ steps.calc_version.outputs.new_version }}`（${{ needs.decide.outputs.version_type }} 自增）
            - 本 PR 由机器人提交，提交已签名（满足分支保护的签名要求），但仍需人工批准与合并。
            - **合并后**：本工作流会自动创建并推送 `v${{ steps.calc_version.outputs.new_version }}`，
              该 tag 推送将触发 测试 → 质量检查 → 构建 → 发布 PyPI → 创建 GitHub Release。
          delete-branch: true

  # ─── 路径 2：bump PR 刚合并 → 自动打 tag（tag 推送再触发路径 3）───
  tag-release:
    name: 🏷️ 打 tag
    needs: decide
    if: needs.decide.outputs.action == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          # 用 PAT 而非内置 GITHUB_TOKEN：见文件头 (b) —— GITHUB_TOKEN 推的 tag 不会
          # 触发本工作流，会让「打 tag → 发布」这条接力静默断掉
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: 创建并推送 tag
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG 已存在，中止（不改写既有 tag）"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "已推送 tag $TAG —— 经 PAT 推送，将触发 测试 / 质量检查 / 构建 / 发布"

  # ─── 路径 4：main 的 bump 合并 → 自动向 dev 开 back-merge PR（#82 治根因）───
  backmerge-dev:
    name: 🔁 回并 main 版本线到 dev
    needs: decide
    # 与 tag-release 并行：两者都由"main 上只改了三处声明"触发，互不依赖
    if: needs.decide.outputs.action == 'tag' && needs.decide.outputs.branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: 读 main 当前版本（供标题）
        id: main_version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 开 back-merge PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          # 同 bump PR：需 RELEASE_PAT（理由见文件头）。分支名带 sha 保证每轮唯一，
          # 不复用上一轮 head；无工作区改动时 PR diff 即 main 领先 dev 的提交。
          token: ${{ secrets.RELEASE_PAT }}
          base: dev
          branch: backmerge/main-${{ github.sha }}
          sign-commits: true
          delete-branch: true
          title: "chore(release): back-merge main 版本线（v${{ steps.main_version.outputs.version }}）到 dev"
          body: |
            自动生成（release.yml 路径 4 / #82）：main 已升到 `v${{ steps.main_version.outputs.version }}`，
            本 PR 把 main 的版本声明回并进 dev，使 dev 后续 bump 沿正确版本线续算。

            - 历史上 main 的 bump 不回流 dev，两条线分叉后 dev 连发过倒退的 0.8.3b0/0.8.4b0；
              另有下限抬升兜底（scripts/next_version.py），但漏合本 PR 仍会让 dev 声明暂时落后。
            - 正常节奏下 dev 未触碰三处版本声明，本 PR 应无冲突。
            - **合入 dev 后不会触发打 tag**：decide 的声明回声检测会识别这次推送。
            - 本 PR 由机器人提交，仍需人工批准与合并。

  # ─── 路径 3：tag 推送 → 测试 → 质量 → 构建 → 发布 ───
  test:
    name: 🧪 运行测试
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=zoo_framework --cov-report=xml --cov-fail-under=30

  quality:
    name: 🔍 代码质量检查
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check zoo_framework

      # 与独立的 quality.yml 对齐：mypy 在两边都是硬门禁 —— quality.yml 那侧的
      # continue-on-error 已由变更 establish-type-gate 的 4.1 移除，此处随之移除
      # （原先的注释写着"mypy 不卡门禁"，那个前提已经不存在了）。
      - name: Run MyPy
        run: mypy zoo_framework

  release:
    name: 🚀 发布
    # 发布 MUST 以测试与质量检查为前提（变更 4.2 的验收条件就落在这条 needs 链上）
    needs: [test, quality]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zoo-framework/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build toml

      - name: 校验 tag 与声明的版本一致
        id: version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "tag=$GITHUB_REF_NAME / pyproject=$VERSION"
          # 两者必须同源，否则会发出一个"标签与版本对不上"的 release
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 pyproject.toml 的版本 ($VERSION) 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: python -m build

      # ── SBOM（packaging-standards / #119）──
      # 位置刻意放在构建之后、签名之前：SBOM 描述的就是即将发布的 dist/ 产物。
      # 刻意不加 continue-on-error —— "看起来成功但没有 SBOM"的 release 比没有更糟。
      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # ── Sigstore keyless 签名（#94 / Scorecard Signed-Releases）──
      # Scorecard 按 Release 附件的**文件名**识别签名：*.sig 计为已签名（该 release 得
      # 8 分，近 5 个 release 平均）。cosign keyless 模式无密钥可保管，身份绑定
      # workflow 仓库+调用方，证书经 OIDC 下发并回写 Rekor 透明日志，比手工 GPG 可持续。
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: Sign release artifacts
        env:
          COSIGN_YES: "true"
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
            echo "signed: $f -> ${f}.sig"
          done
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1（2026-10 取数）
        # 刻意不传 password：OIDC trusted publishing 的触发条件就是
        # `user == __token__`（该 action 的 user 输入默认值）且 password 为空 ——
        # 见 twine-upload.sh 的 `[[ "${INPUT_USER}" == "__token__" && -z "${INPUT_PASSWORD}" ]]`。
        # 原先这里写 `password: ${{ secrets.PYPI_API_TOKEN }}`，但本仓库并无该 secret
        # （gh secret list 只有 PYPI），故它一直解析为空值、走的本来就是 OIDC；写在这里
        # 只会误导。若确实想改用 API token，需在 PyPI 账号侧签发 token 并加成本仓库的
        # secret 后再传 password —— 反之，一旦有人误加同名 secret，认证方式就会从 OIDC
        # 悄悄切回 token，而 OIDC 是更推荐的做法。

      - name: Generate Changelog
        id: changelog
        run: |
          # 正路（#117）：release 正文 = CHANGELOG.md 里该版本段（四段模板见
          # docs/RELEASE_PROCESS.md）。脚本找不到该版本段时非零退出，此时回退到
          # 提交标题列表并在正文标注「未整理」——发布不能被文档阻塞，但回退必须可见。
          VERSION="${{ steps.version.outputs.version }}"
          if python scripts/notes_from_changelog.py "$VERSION" > release_notes.md 2>/dev/null; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "source=commits" >> "$GITHUB_OUTPUT"
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              git log --pretty=format:"- %s (%h)" --no-merges | head -20 > release_notes.md
            else
              git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -20 > release_notes.md
            fi
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 🎉 Release ${{ github.ref_name }}

            **类型:** ${{ contains(github.ref_name, '-beta') && '🧪 测试版本' || '🚀 正式版本' }}
            **版本:** `${{ steps.version.outputs.version }}`

            ${{ steps.changelog.outputs.source == 'changelog' && format('### 📋 使用者可见的变化', '') || '### 📋 变更记录（未整理 —— CHANGELOG.md 里没有该版本的条目，见 docs/RELEASE_PROCESS.md）' }}

            ${{ steps.changelog.outputs.changelog }}

            ### ⚠️ 破坏性变更与迁移
            （以本版本 CHANGELOG 段的 BREAKING 标注为准；无标注即无）

            ### 📝 已知问题
            （见 README「其它明确的限制」表）

            ### 📦 安装

            ```bash
            pip install zoo-framework==${{ steps.version.outputs.version }}
            ```

            ### 📚 文档
            - [使用者文档](https://yearsalso.github.io/zoo-framework-doc/)
            - [维护者文档](https://github.com/${{ github.repository }}/blob/main/docs/README.md)
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sig
            dist/*.pem
            dist/*.spdx.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Success
        run: |
          echo "🎉 发布成功！"
          echo "版本: ${{ github.ref_name }}"
          echo "PyPI: https://pypi.org/project/zoo-framework/${{ steps.version.outputs.version }}/"
