# align-execution-primitives 任务组 5：bench 三平台原生取数
#
# 承接 `adopt-rust-core` 的未完成项——800x / 13x / 12.4x 与 `DECISION.md` 的框架
# 开销数字目前只在 Windows 上成立；WSL2 的取数被 Hypervisor 放大约 3 倍不可用，
# 原生 Linux 与 macOS 必须由 CI 来取。
#
# 与 tests.yml 里被删除的死 benchmark 作业不同（那指向不存在的 tests/benchmarks/），
# 本作业运行的是仓库根 `bench/` 的真实测量脚本。
#
# **不门禁功能开发**：只由手动与定时触发；某平台脚本失败不阻断其余平台
# （fail-fast: false），留档优先于整齐。
#
# **不跑** `measure_boundary.py` / `compare_execution_models.py`：两者硬依赖已构建
# 的 PyO3 探针（cargo/maturin），Rust 已裁定 no-go（见 bench/DECISION.md），
# 不值得为边界测量扩 CI 工具链。

name: Bench

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 默认控制台编码（cp1252/GBK）无法编码脚本里的中文与 emoji
      # 输出，实测首跑在 windows-latest 以 UnicodeEncodeError 崩（Linux/macOS 成功）。
      # 强制 UTF-8 与跨平台文本 I/O 契约（cross-platform-io）同口径。
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 定时器分辨率测量
        run: python bench/measure_timer.py

      - name: 框架开销分层测量
        run: python bench/profile_framework.py

      - name: Upload bench results
        # always()：单个脚本失败时，其余已产出的数据仍是留档——原始数据比整齐的
        # 绿色作业更有用（与 DECISION.md 的取数纪律一致）。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: bench/results/*.json
          if-no-files-found: warn
