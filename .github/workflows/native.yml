# Native extension (native/) build, load and test -- issue #129
#
# Why a separate workflow: #129 measured that native/ had *zero* CI (all eight
# workflows were Python-side), so "the go verdict only existed in a measurement
# report, not in any installable artifact". This workflow turns three things into
# gates: (1) `cargo test` runs on three platforms, (2) an abi3 wheel can be built,
# (3) the SAME wheel loads on two Python versions and passes the native pytest
# paths -- (3) is only meaningful now that abi3 is on, hence its own job.
name: Native

on:
  push:
    branches: [main, dev]
    paths:
      - 'native/**'
      - 'zoo_framework/native/**'
      - 'tests/test_native_extension.py'
      - 'tests/test_native_task_execution.py'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'zoo_framework/native/**'
      - 'tests/test_native_extension.py'
      - 'tests/test_native_task_execution.py'
      - '.github/workflows/native.yml'
  workflow_dispatch:

# Scorecard Token-Permissions: read-only
permissions:
  contents: read

jobs:
  native-tests:
    name: cargo test + native pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          toolchain: stable

      - name: cargo test
        working-directory: native
        run: cargo test

      - name: Install the Python side
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the extension (abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          working-directory: native
          command: build
          args: --release --out dist

      - name: Install the built wheel
        # --no-index: resolve only from the local dist, so we install what we just built
        run: pip install --no-index --find-links native/dist zoo-framework-native

      - name: Native pytest paths
        run: pytest tests/test_native_extension.py tests/test_native_task_execution.py -q

  wheel:
    name: build abi3 wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          toolchain: stable

      - name: Build the extension (abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          working-directory: native
          command: build
          args: --release --out dist

      - name: Assert the wheel is abi3
        # Without the abi3 tag, "one wheel covers many versions" is false and the
        # abi3-load job below would be testing nothing.
        run: |
          ls -l native/dist
          ls native/dist/*.whl | grep -q 'abi3' || {
            echo "::error::wheel filename has no abi3 tag -- abi3 is not in effect"
            exit 1
          }

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-wheel
          path: native/dist/*.whl

  abi3-load:
    name: same wheel on Python ${{ matrix.python-version }}
    needs: wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the wheel built once in the wheel job
        # The point: this downloads the SAME artifact instead of rebuilding per
        # interpreter -- that is the evidence that one abi3 wheel covers both.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: native-wheel
          path: native/dist

      - name: Install the Python side
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the wheel and report what got installed
        run: |
          pip install --no-index --find-links native/dist zoo-framework-native
          python -c "import sys, zoo_framework_native; print(sys.version); print(zoo_framework_native.__file__)"

      - name: Native pytest paths
        run: pytest tests/test_native_extension.py tests/test_native_task_execution.py -q
