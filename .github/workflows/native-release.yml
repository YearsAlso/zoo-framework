# Native extension wheel release -- issue #129
#
# Separate from release.yml on purpose: release.yml owns the main package's
# bump/decide/tag logic and is coupled to the three version declarations. The
# native wheel is a second distribution with its own version (native/pyproject.toml),
# so it gets its own tag-driven workflow instead of another branch inside that one.
#
# Triggers:
#   - push of a v* tag (the same tags release.yml pushes) -> publish to PyPI
#   - manual dispatch -> dry run against TestPyPI by default
#
# Idempotence: the native version only moves when someone bumps native/pyproject.toml.
# Every framework tag after that would otherwise re-publish the same version and fail,
# so the publish step checks PyPI first and skips when the version already exists.
#
# Prerequisite, one-time and manual: the PyPI project `zoo-framework-native` does not
# exist yet, so it needs a **pending publisher** (pypi.org -> Account -> Publishing)
# with Owner=YearsAlso, Repository=zoo-framework, Workflow=native-release.yml,
# Environment=pypi. Without it the OIDC exchange is rejected with `invalid-publisher`
# and the publish step fails -- that is exactly what happened on the first three tags
# (v0.12.3-beta, v0.13.0, v0.13.1-beta), all with an identical annotation.
#
# First real run: tag v0.13.1-beta, 2026-10-13 (run 38357074578). OIDC succeeded once the
# pending publisher existed, and the run went green -- but it published only ONE of the
# three wheels. The three build jobs each uploaded under the same artifact name, which
# does NOT merge into a single artifact, so the download step (which took `name:`) got
# one of them and the publish step uploaded what it had. Fixed by giving every build job
# a unique artifact name, downloading by pattern, and gating on the artifact count.
# What is still unverified after that fix: that a real tag publishes all three wheels --
# `zoo-framework-native` 0.1.0 on PyPI is Windows-only until a re-publish or a new
# version goes out. Do not claim the publish path ships every platform until then.
name: Native Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target'
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build-linux:
    name: build wheel (manylinux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          toolchain: stable

      - name: Build the extension (abi3, manylinux)
        # manylinux: auto -- a plain linux_x86_64 wheel is not accepted by PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          working-directory: native
          command: build
          args: --release --out dist
          manylinux: auto

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          # 每个构建作业一个唯一产物名 —— 见 build-cross 的注释：同名上传不会合并成
          # 一个 artifact，下游按名字取物会退化成只拿到其中一个。
          name: native-wheels-linux
          path: native/dist/*.whl

  build-cross:
    name: build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 产物名逐个写死，MUST NOT 让多个构建作业共用一个名字：同名上传不会合并成一个
      # artifact，而是各自成为一个（2026-10-13 的 v0.13.1-beta 实测 `name=native-wheels`
      # 返回 total_count=3）；publish 端按名字取物时就退化成只拿到其中一个 ——
      # 那次发布因此只发出去 Windows 一个 wheel，另两个平台的包静默丢失。
      matrix:
        include:
          - os: macos-latest
            artifact: native-wheels-macos
          - os: windows-latest
            artifact: native-wheels-windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249  # stable
        with:
          toolchain: stable

      - name: Build the extension (abi3)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          working-directory: native
          command: build
          args: --release --out dist

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: native/dist/*.whl

  publish:
    name: publish to ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
    needs: [build-linux, build-cross]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted publishing; no long-lived token
      id-token: write
      # 产物闸门要读本 run 的产物清单（contents: read 来自 workflow 级）
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all wheels
        # pattern + merge-multiple：三个构建作业的产物名各不相同，这里要的是**全场**，
        # 不是一个。按单名取物正是那次只发出一个 wheel 的直接原因。
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: native-wheels-*
          merge-multiple: true
          path: dist

      - name: Read the native version and check whether it is already published
        id: check
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("native/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/zoo-framework-native/$VERSION/json")
          echo "pypi_status=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "zoo-framework-native $VERSION is already on PyPI -- skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List the wheels that would be published
        run: ls -l dist

      - name: Assert every built wheel made it into dist
        # 闸门：产物集合收不全时必须红，不能发出半份。
        # 「应有多少个」不写死平台清单或数字（会随矩阵漂移），而是问本 run 实际登记了
        # 几个 native-wheels-* 产物 —— 与 dist 里的 wheel 数对死，少一个就拒绝发布。
        # 与发布步骤同一个条件：版本已存在时整轮不发布，闸门也就不必拦。
        if: ${{ steps.check.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACTS=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("native-wheels-")) | select(.expired == false)] | length')
          WHEELS=$(ls dist/*.whl 2>/dev/null | wc -l | tr -d ' ')
          echo "native-wheels-* artifacts=$ARTIFACTS, wheels in dist=$WHEELS"
          [ "$ARTIFACTS" -gt 0 ] || {
            echo "::error::本 run 没有 native-wheels-* 产物，构建侧出了问题"
            exit 1
          }
          [ "$ARTIFACTS" -eq "$WHEELS" ] || {
            echo "::error::dist 里有 $WHEELS 个 wheel，但本 run 有 $ARTIFACTS 个 native-wheels-* 产物 —— 产物收不全，拒绝发布"
            exit 1
          }

      - name: Publish to TestPyPI
        if: ${{ steps.check.outputs.exists == 'false' && github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI
        if: ${{ steps.check.outputs.exists == 'false' && (github.event_name == 'push' || inputs.target == 'pypi') }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist
